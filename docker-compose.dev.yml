services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: threejs-game-app-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-game_user}:${POSTGRES_PASSWORD:-game_password}@postgres:5432/${POSTGRES_DB:-threejs_game}?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin123}
      S3_BUCKET: ${S3_BUCKET:-threejs-game-assets}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_STORAGE_PROVIDER: ${S3_STORAGE_PROVIDER:-minio}
      AUTH_SESSION_DAYS: ${AUTH_SESSION_DAYS:-7}
      LOG_STATS: ${LOG_STATS:-true}
      ASSET_PUBLIC_BASE_URL: ${ASSET_PUBLIC_BASE_URL:-}
      ASSET_MAX_UPLOAD_BYTES: ${ASSET_MAX_UPLOAD_BYTES:-52428800}
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-alpine
    container_name: threejs-game-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-game_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-game_password}
      POSTGRES_DB: ${POSTGRES_DB:-threejs_game}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-game_user} -d ${POSTGRES_DB:-threejs_game}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: threejs-game-redis-dev
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data_dev:/data

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: threejs-game-minio-dev
    restart: unless-stopped
    user: "0:0"
    command: [ "server", "/data", "--console-address", ":9001" ]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin123}
    ports:
      - "9000:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data_dev:/data

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    container_name: threejs-game-minio-init-dev
    depends_on:
      - minio
    restart: "no"
    entrypoint: >
      /bin/sh -c " until mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin123}; do sleep 2; done; mc mb --ignore-existing local/${S3_BUCKET:-threejs-game-assets}; "

volumes:
  postgres_data_dev:
  redis_data_dev:
  minio_data_dev:
