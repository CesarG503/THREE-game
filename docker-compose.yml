version: '3.8'

services:
  game-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"      # Changed from 80 to 3000 to avoid conflicts with Dokploy router
      - "8080:8080"      # Backend WebSocket maps directly 8080 to 8080
    container_name: threejs-game-app
    restart: unless-stopped
